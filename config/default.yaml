# Configuración Maestra por Defecto de IA Video Editor Pro

project:
  name: "Untitled Project"
  language: "es"
  format: "9:16"
  target_resolution:
    width: 1080
    height: 1920
  fps: 30
  edit_mode: "social"

ingest:
  generate_proxies: true
  proxy_resolution:
    width: 720
    height: 1280
  proxy_crf: 28
  extract_audio_wav: true
  audio_sample_rate: 44100
  audio_channels: 1

speech:
  engine: "faster-whisper"
  model: "small"
  language: "es"
  compute_type: "int8"
  word_timestamps: true

silence:
  analyze_above_ms: 250
  suggest_cut_above_ms: 500
  aggressive_cut_above_ms: 1000
  padding_ms: 80

vision:
  face_tracking: true
  model_selection: 0
  min_detection_confidence: 0.5
  reframe_dead_zone: 0.12
  reframe_smoothing_window: 15
  no_face_fallback: "center_crop" # options: center_crop, blurred_bg

editorial:
  pacing_mode: "balanced"
  hook_min_score: 0.70
  max_zoom_scale: 1.12
  min_zoom_duration_ms: 800
  zoom_cooldown_ms: 2000

audio:
  target_lufs: -14.0
  true_peak: -1.0
  voice_enhancement: true
  high_pass_freq_hz: 80
  compression_ratio: 3.5
  ducking_enabled: true
  ducking_gain_db: -8.0
  ducking_attack_ms: 150
  ducking_release_ms: 600

subtitles:
  enabled: true
  style: "bold_pop"
  font_family: "Arial Black"
  font_size: 48
  primary_color: "&H00FFFFFF"
  highlight_color: "&H0000FFFF" # Amarillo / Oro
  outline_color: "&H00000000"
  outline_width: 3
  shadow_width: 1
  safe_area_bottom_pct: 0.18
  safe_area_top_pct: 0.10
  export_sidecar_srt: true

ai:
  provider: "gemini"
  model: "gemini-3.7-flash"
  temperature: 0.2
  timeout_seconds: 30
  fallback: "local_heuristic"

export:
  hardware_acceleration: "auto" # auto, videotoolbox, cpu
  video_codec: "h264_videotoolbox"
  audio_codec: "aac"
  audio_bitrate: "192k"
  crf: 20
